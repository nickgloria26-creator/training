<title>Training Log</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--card2:#eef0f3;--text:#0f1217;--muted:#6b7280;--line:#e2e5ea;--accent:#3b6cf6;--accent-ink:#fff;--good:#14a34a;--warn:#d97706;--bad:#dc2626;--swim:#0e9fb8;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f12;--card:#171a20;--card2:#22262e;--text:#eef1f5;--muted:#8a93a3;--line:#2a2f38;--accent:#5b8cff;--accent-ink:#fff;--good:#2fd06b;--warn:#f5a524;--bad:#ff5a5a;--swim:#22c3dc;--shadow:none}}
:root[data-theme="dark"]{--bg:#0d0f12;--card:#171a20;--card2:#22262e;--text:#eef1f5;--muted:#8a93a3;--line:#2a2f38;--accent:#5b8cff;--good:#2fd06b;--warn:#f5a524;--bad:#ff5a5a;--swim:#22c3dc;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
#app{max-width:560px;margin:0 auto;padding:10px 14px 24px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid transparent;border-radius:10px;padding:9px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
h1{font-size:28px;line-height:1.1;margin:2px 0 0;letter-spacing:-.02em}
h2{font-size:22px;margin:2px 0 6px;letter-spacing:-.01em}
h3{font-size:19px;margin:0 0 12px}
p{margin:6px 0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.tiny{font-size:12.5px}.center{text-align:center}.mt{margin-top:10px}
.good-t{color:var(--good)}.warn-t{color:var(--warn)}.bad-t{color:var(--bad)}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:8px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0 12px}
.card{display:block;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:22px;flex:none;box-shadow:var(--shadow)}
.iconbtn.sm{width:36px;height:36px;font-size:16px;background:var(--card2);box-shadow:none}
.iconbtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.danger{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:13px;font-weight:650;background:var(--card2)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.4}
.btn.ghost{background:var(--card2)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.btn.big{min-height:54px;font-size:17px;width:100%;margin-top:12px;border-radius:15px}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn:active,.chip:active,.chk:active,.listrow:active,.day:active{transform:scale(.97)}
.link{color:var(--accent);font-weight:600;font-size:14px;padding:6px 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:9px 13px;border-radius:999px;background:var(--card2);font-weight:600;font-size:14px}
.chip.gym{box-shadow:inset 3px 0 0 var(--accent)}.chip.swim{box-shadow:inset 3px 0 0 var(--swim)}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px}
.day{background:var(--card);border-radius:14px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow);border:2px solid transparent}
.day .dn{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
.day .dd{font-size:17px;font-weight:700}
.day .dl{font-size:10.5px;font-weight:700;color:var(--muted)}
.day.gym .dl{color:var(--accent)}.day.swim .dl{color:var(--swim)}
.day.today{border-color:var(--accent)}
.day.done.gym{background:var(--accent);color:#fff}.day.done.swim{background:var(--swim);color:#fff}
.day.done .dn,.day.done .dl{color:rgba(255,255,255,.85)}
.day.miss{background:color-mix(in srgb,var(--bad) 12%,var(--card))}.day.miss .dl{color:var(--bad)}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-bottom:12px}
.tally>div{background:var(--card);border-radius:14px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}
.tally b{font-size:20px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tally span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.tally .ok b{color:var(--good)}
/* hero */
.hero h2{font-size:26px}
.hero.gym{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,var(--card)) 0%,var(--card) 55%)}
.hero.swim{background:linear-gradient(160deg,color-mix(in srgb,var(--swim) 18%,var(--card)) 0%,var(--card) 55%)}
.hero.donecard{background:linear-gradient(160deg,color-mix(in srgb,var(--good) 16%,var(--card)) 0%,var(--card) 60%)}
.hero.resume{background:linear-gradient(160deg,color-mix(in srgb,var(--warn) 18%,var(--card)) 0%,var(--card) 60%)}
.exlist{margin:10px 0 4px}
.exrow{display:grid;grid-template-columns:1fr auto 64px;gap:8px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline;font-size:14.5px}
.exrow:first-child{border-top:0}
.exrow .w{font-weight:750;font-variant-numeric:tabular-nums}.exrow .w.up{color:var(--good)}.exrow .w s{color:var(--muted);font-weight:500;font-size:12px}
.exrow .r{color:var(--muted);font-size:13px;text-align:right}
.exrow.opt .n{color:var(--muted)}
.exrow.mainp .n{font-weight:700;color:var(--swim)}
.exrow small{font-size:11px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card.mini .big{font-size:22px;font-weight:750;margin:4px 0 2px}.card.mini small{font-size:13px;color:var(--muted)}
.nag{background:color-mix(in srgb,var(--warn) 14%,var(--card));display:flex;flex-direction:column;gap:2px}
.nag span{font-size:13px;color:var(--muted)}
.warncard{background:color-mix(in srgb,var(--bad) 8%,var(--card))}
.listrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 2px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.listrow:first-of-type{border-top:0}
.listrow .grow{display:flex;flex-direction:column}
.listrow.danger{color:var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--accent)}.dot.swim{background:var(--swim)}
.review ul{margin:4px 0 6px;padding-left:18px}.review li{font-size:14px;margin:2px 0}.rv{margin-top:10px}
/* session */
.sesshead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 0;margin:-10px 0 4px;background:var(--bg)}

.excard{padding:13px 12px}

.exname{font-size:17px;font-weight:750;text-align:left}
.sugg{margin:8px 0 4px;padding:8px 10px;border-radius:10px;background:var(--card2);font-size:13.5px}

.badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:var(--line);margin-right:4px;vertical-align:1px}
.badge.up{background:var(--good);color:#fff}.badge.stall{background:var(--warn);color:#fff}.badge.down{background:var(--bad);color:#fff}
.cue{color:var(--muted);font-style:italic;margin-top:2px}
.sethead,.set{display:grid;grid-template-columns:18px minmax(0,1.2fr) minmax(0,1fr) 50px 46px;gap:6px;align-items:center}
.sethead{margin-top:10px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center}
.set{padding:5px 0}
.set .sn{font-weight:700;color:var(--muted);text-align:center;font-size:14px}
.stp{display:flex;align-items:stretch;background:var(--card2);border-radius:11px;height:44px;overflow:hidden}
.stp button{width:30px;flex:none;font-size:20px;color:var(--muted)}
.stp input{flex:1;min-width:0;text-align:center;background:transparent;border:0;border-radius:0;padding:0;font-weight:750;font-size:18px;font-variant-numeric:tabular-nums}

.rirrow{display:flex;gap:6px;padding:2px 0 6px 24px}

.exact{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
/* swim */
.mainpiece{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--swim) 50%,transparent)}

.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}

.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.tm{display:flex;flex-direction:column;font-size:11px;font-weight:700;color:var(--muted)}
.tm input{text-align:center;font-weight:750;font-size:17px;padding:9px 4px;margin-top:2px;font-variant-numeric:tabular-nums}
.tm.ok input{background:color-mix(in srgb,var(--good) 18%,var(--card2))}.tm.slow input{background:color-mix(in srgb,var(--warn) 18%,var(--card2))}
.tm.wide{margin-top:10px}
/* charts */
.chart{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:9.5px;font-weight:600}
.chart .axis.cur{fill:var(--text)}
.chart .val{fill:var(--text);font-size:9.5px;font-weight:700}
.chart .target{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 3}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.dash{background:none;border-top:2px dashed var(--warn);height:0;width:14px;border-radius:0;vertical-align:3px}

.wcol{display:flex;flex-direction:column;align-items:flex-end;min-width:58px;font-size:15px}
.empty{padding:22px 6px;text-align:center;color:var(--muted);font-size:14px}

.rung.done{background:color-mix(in srgb,var(--good) 16%,transparent)}.rung.done span{color:var(--good)}
.rung.cur{background:var(--swim);color:#fff}.rung.cur span{color:#fff}
/* plan */

.search{margin-bottom:6px}
.bwin{display:flex;gap:10px;align-items:center;margin:12px 0 0}

.bwin input{flex:1;text-align:center;font-size:30px;font-weight:800;height:56px}

ol{padding-left:18px;margin:6px 0}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}

#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--accent)}
/* rest timer */
#rest{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;background:var(--text);color:var(--bg);border-radius:18px;padding:0 0 8px;transform:translateY(160%);transition:transform .25s;max-width:540px;margin:0 auto;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#rest.on{transform:none}
.rbar{height:4px;background:color-mix(in srgb,var(--bg) 25%,transparent)}.rbar i{display:block;height:100%;background:var(--good);transition:width .5s linear}
.rrow{display:flex;align-items:center;gap:8px;padding:8px 10px 0}
.rrow button{height:42px;min-width:48px;border-radius:12px;background:color-mix(in srgb,var(--bg) 16%,transparent);font-weight:750}
.rt{flex:1;text-align:center;display:flex;flex-direction:column}.rt b{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.rt b.go{color:var(--good)}.rt span{font-size:11.5px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sheet-panel{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .2s}
#sheet.on .sheet-panel{transform:none}
.sheet-grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px;display:block}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:50;transition:transform .25s;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
@media (max-width:360px){#app{padding:8px 10px}.sethead,.set{grid-template-columns:14px minmax(0,1.2fr) minmax(0,1fr) 44px 42px;gap:4px}.stp button{width:26px}.times{grid-template-columns:repeat(2,1fr)}}
.rings{padding:14px 12px}
.ringrow{display:flex;align-items:center;gap:14px}
.ringc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.ringw{position:relative;width:74px;height:74px}.ringw svg{width:74px;height:74px}
.rbg{fill:none;stroke:var(--card2);stroke-width:8}.rfg{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dasharray .5s}
.rv2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px}.rv2 b{font-size:22px}.rv2 small{font-size:12px;color:var(--muted)}
.ringstat{flex:1;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:baseline}.ringstat b{font-size:19px;text-align:right}.ringstat span{font-size:12.5px;color:var(--muted)}
.pill.hot{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.pill.swimpill{background:color-mix(in srgb,var(--swim) 16%,transparent);color:var(--swim)}
.excard{scroll-margin-top:70px}
.excard.collapsed{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;opacity:.85;font:inherit;color:inherit;border:0}
.okc{width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}
.badge.coach{background:var(--swim);color:#fff}.sugg.coach{background:color-mix(in srgb,var(--swim) 15%,transparent)}
.coachcard{box-shadow:inset 3px 0 0 var(--swim)}.coachcard p{margin:6px 0 0;font-size:14.5px;line-height:1.45}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.bdg{background:var(--card2);border-radius:12px;padding:9px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;opacity:.42;filter:grayscale(1)}
.bdg.got{opacity:1;filter:none;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--good) 50%,transparent)}
.bdg .be{font-size:24px}.bdg b{font-size:12px;line-height:1.2}.bdg small{font-size:10.5px;color:var(--muted);line-height:1.2}
</style>

<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="rest"></div>
<div id="sheet"><div class="sheet-panel"><span class="sheet-grab"></span><div class="sheet-body"></div></div></div>
<div id="toast"></div>
<script>
// ---------- SEED: training program (history is restored privately) ----------
function seedState(){
  const ex={};
  const E=(id,name,muscle,repMin,repMax,inc,rest,o={})=>{ex[id]=Object.assign({id,name,muscle,repMin,repMax,inc,rest},o)};
  E('latpd','Lat pulldown','Back',8,10,5,150,{note:'Stack goes 40 → 45. Next plate up when 10/10/10'});
  E('incdb','Incline DB press','Chest',8,10,2,180,{perHand:true,note:'kg per dumbbell. Cap set 1 at 10'});
  E('lowrow','Chest-supported low row','Back',10,12,2.5,120,{note:'Towel over pad. Set 1 at 12 max'});
  E('shpress','Machine shoulder press','Shoulders',8,10,2.5,150,{note:'Full rest'});
  E('latraise','Single-arm cable lateral raise','Shoulders',12,15,2.5,60,{note:'Reps per arm'});
  E('facepull','Face pull','Shoulders',12,15,2.5,75,{note:'Rope at forehead height, elbows high, slow squeeze'});
  E('cablecurl','Cable curl (two arms)','Biceps',10,12,2.5,75,{note:'Set 1 at 11 max'});
  E('pushdown','Tricep pushdown','Triceps',10,12,2.5,75,{note:'Straight bar'});
  E('legpress','Leg press','Quads',8,10,5,180,{});
  E('legcurl','Leg curl','Hamstrings',10,12,2.5,120,{});
  E('legext','Leg extension','Quads',10,12,2.5,120,{});
  E('calf','Calf raise (leg press)','Calves',12,15,5,90,{note:'2 sec pause at the bottom or it does not count'});
  E('crunch','Cable crunch','Abs',10,15,5,60,{note:'Stop at 2 RIR'});
  E('pullup','Assisted pull-up','Back',7,10,4,150,{assist:true,progressAt:8,note:'Weight = assist. Less assist = harder. 8/8/8 earns the next step'});
  E('chestpress','Machine chest press','Chest',10,12,2.5,150,{note:'Full rest, no rushing'});
  E('ubrow','Upper back row (machine)','Back',10,12,2.5,120,{note:'Full 2 min'});
  E('pecdeck','Pec deck','Chest',12,15,2.5,75,{});
  E('hammer','Hammer curl','Biceps',10,12,2,75,{perHand:true,note:'kg per dumbbell. 10 max on set 1'});
  E('ohext','Overhead cable tricep extension','Triceps',10,12,2.5,75,{note:'Rope'});
  E('hack','Hack squat','Quads',6,8,10,120,{note:'Weight = plates added. 0 = sled only. Back flat on pad'});
  E('hipthrust','Hip thrust machine','Glutes',10,12,2.5,120,{note:'1 sec pause at top'});

  const T={};
  const G=(id,name,short,items)=>{T[id]={id,name,short,kind:'gym',items:items.map(([e,s,w])=>({ex:e,sets:s,warmup:w||''}))}};
  G('UA','Upper A','UA',[['latpd',3,'1×8 @ 30'],['incdb',3,'1×8 @ 10s'],['lowrow',3],['shpress',3],['latraise',3],['facepull',2],['cablecurl',3],['pushdown',3]]);
  G('LA','Lower A','LA',[['legpress',3,'1×8 @ 40'],['legcurl',3],['legext',3],['calf',3],['crunch',2]]);
  G('UB','Upper B','UB',[['pullup',3,'1×8 @ 35 assist'],['chestpress',3,'1×8 @ 20'],['ubrow',3],['pecdeck',3],['latraise',3],['facepull',2],['hammer',3],['ohext',3]]);
  G('LB','Lower B','LB',[['hack',3,'Hack squats are the leg press warm-up'],['legpress',3],['hipthrust',3],['legcurl',3],['calf',3],['crunch',2]]);
  const WU={label:'Warm-up',reps:1,dist:200,stroke:'Free',rest:30,note:'3-4/10, breathe every 3. Last 50 a touch quicker'};
  const DR={label:'Drills',reps:4,dist:50,stroke:'Drill',rest:20,note:'2 catch-up, 2 single-arm (25 R arm, 25 L arm). Exhale underwater, head down'};
  const CD={label:'Cool-down',reps:1,dist:100,stroke:'Free',rest:0,optional:true,note:'Optional. Backstroke fine'};
  T.SWM={id:'SWM',name:'Swim: main set',short:'Swim',kind:'swim',pieces:[WU,DR,{label:'Main set',main:true},CD]};
  T.SWE={id:'SWE',name:'Swim: easy technique',short:'Easy',kind:'swim',pieces:[WU,DR,{label:'Smooth 50s',reps:4,dist:50,stroke:'Free',rest:30,note:'5/10. Count strokes per length, try to drop one by the last'},CD]};
  T.SWS={id:'SWS',name:'Swim: steady aerobic',short:'Steady',kind:'swim',pieces:[WU,{label:'Steady 100s',reps:5,dist:100,stroke:'Free',rest:30,note:'5-6/10, same pace every one. Builds the engine for the 400'},CD]};

  const plan={days:[
    {tpl:'UA',time:'18:00'},{tpl:'LA',time:'18:00'},{tpl:'SWM',time:'18:00'},{tpl:'SWE',time:'18:00'},
    {tpl:'UB',time:'18:00'},{tpl:'LB',time:'11:00'},{tpl:'SWS',time:'11:00'}],
    overrides:{'2026-11-02':'REST','2026-11-03':'UB','2026-11-04':'LB','2026-11-05':'SWM','2026-11-06':'UA','2026-11-07':'LA','2026-11-08':'SWE'}};

  const sessions=typeof seedHistory==='function'?seedHistory(T):[];
  return {v:1,exercises:ex,templates:T,plan,sessions,draft:null,bodyweight:[],
    swim:{steps:[{name:'8x50',reps:8,dist:50,rest:20},{name:'4x100',reps:4,dist:100,rest:30},{name:'2x200',reps:2,dist:200,rest:40},{name:'400 continuous',reps:1,dist:400,rest:0}],idx:1,targetPace:170},
    settings:{effort:'RIR',goalGym:4,goalSwim:3,lastBackup:null,goals:'',name:'',bwGoal:null,welcomed:false}};
}

'use strict';
// ---------- utils ----------
const KEY='nick-training.v1';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const todayStr=()=>ymd(new Date());
const dowIdx=s=>(parseYmd(s).getDay()+6)%7;
const daysBetween=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const fmtDate=s=>parseYmd(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const fmtShort=s=>parseYmd(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const fmtT=sec=>{if(sec==null||isNaN(sec))return'–';sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`};
const parseT=str=>{str=String(str??'').trim();if(!str)return null;if(str.includes(':')){const p=str.split(':').map(Number);if(p.some(isNaN))return null;return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]}const n=str.replace(/\D/g,'');if(!n)return null;if(n.length<=2)return +n;return +n.slice(0,-2)*60+ +n.slice(-2)};
const fw=w=>w==null||w===''?'–':String(Math.round(w*100)/100);
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const e1rm=(w,r)=>w*(1+r/30);

let S, view={tab:'today'}, restT=null, audioCtx=null;

function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);migrate();return}}catch(e){}
  S=seedState();save();
}
function migrate(){
  const d=seedState();
  S.settings=Object.assign(d.settings,S.settings||{});
  S.bodyweight=S.bodyweight||[];S.plan.overrides=S.plan.overrides||{};S.swim=S.swim||d.swim;
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save. Export a backup now.')}}
function save(){saveLocal();if(typeof syncSoon==='function')syncSoon()}

// ---------- plan ----------
function plannedFor(date){const o=S.plan.overrides[date];if(o!==undefined)return o==='REST'?null:(S.templates[o]?o:null);const t=S.plan.days[dowIdx(date)].tpl;return t&&S.templates[t]?t:null}
function planTime(date){return S.plan.days[dowIdx(date)].time||'18:00'}
const sessionsSorted=()=>S.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.endedAt||0)-(a.endedAt||0));
const sessionsOn=date=>S.sessions.filter(s=>s.date===date);
function weekDates(ref){const m=mondayOf(parseYmd(ref||todayStr()));return[...Array(7)].map((_,i)=>ymd(addDays(m,i)))}
function tplKind(t){return S.templates[t]?.kind}

// ---------- progression engine ----------
function exposures(exId,excludeId){
  const out=[];
  for(const s of sessionsSorted()){
    if(s.kind!=='gym'||s.id===excludeId)continue;
    const e=s.entries.find(e=>e.ex===exId);if(!e)continue;
    const sets=e.sets.filter(x=>x.done&&x.r>0&&x.w!=null&&x.w!=='');
    if(sets.length)out.push({date:s.date,sets,sid:s.id});
  }
  return out;
}
function workW(sets,assist){const c={};sets.forEach(s=>c[s.w]=(c[s.w]||0)+1);return +Object.keys(c).sort((a,b)=>c[b]-c[a]||(assist?a-b:b-a))[0]}
function suggestBase(exId,n,forDate,excludeId){
  const ex=S.exercises[exId];forDate=forDate||todayStr();
  const xs=exposures(exId,excludeId).filter(x=>x.date<=forDate);
  if(!xs.length)return{w:ex.startW??'',reps:Array(n).fill(ex.repMin),status:'new',msg:`New. Pick a weight you can do for ${ex.repMin}-${ex.repMax} at 2-3 RIR.`,last:null};
  const last=xs[0],w=workW(last.sets,ex.assist),atW=last.sets.filter(s=>s.w===w);
  const top=ex.progressAt||ex.repMax,step=ex.inc||2.5;
  const next=ex.assist?Math.max(0,+(w-step).toFixed(2)):+(w+step).toFixed(2);
  const lastStr=`${fw(w)} × ${atW.map(s=>s.r).join('/')}`;
  const gap=daysBetween(last.date,forDate);
  const rirs=atW.map(s=>s.rir).filter(v=>v!=null&&v!=='');
  const allTop=atW.length>=n&&atW.slice(0,n).every(s=>s.r>=top);
  const lastReps=j=>atW[j]?.r??atW[atW.length-1]?.r??ex.repMin;
  const base={last:{...last,w,str:lastStr},top};
  if(allTop){
    if(rirs.length&&Math.min(...rirs)<2)return{...base,w,reps:[...Array(n)].map((_,j)=>lastReps(j)),status:'hold',msg:`Hit ${top}+ everywhere but at ${Math.min(...rirs)} RIR. Repeat at 2 RIR, then it moves.`};
    if(gap>10)return{...base,w,reps:[...Array(n)].map((_,j)=>lastReps(j)),status:'hold',earned:next,msg:`Earned ${fw(next)}, but ${gap} days off. Hold once, then jump.`};
    return{...base,w:next,from:w,reps:Array(n).fill(ex.repMin),status:'up',msg:`${top}+ on every set last time. ${ex.assist?'Less assist':'Up'}: ${fw(w)} → ${fw(next)}.`};
  }
  // two sessions in a row mostly under the range at this weight → drop
  const under=x=>{const a=x.sets.filter(s=>s.w===w);return a.length>=2&&a.filter(s=>s.r<ex.repMin).length>=2};
  if(xs[1]&&under(last)&&under(xs[1])){
    const down=ex.assist?+(w+step).toFixed(2):Math.max(0,+(w-step).toFixed(2));
    return{...base,w:down,reps:Array(n).fill(ex.repMin),status:'down',msg:`Under ${ex.repMin} on most sets twice running. Drop to ${fw(down)} and rebuild.`};
  }
  // stall detection
  let streak=0;const tots=[];
  for(const x of xs){if(workW(x.sets,ex.assist)!==w)break;streak++;tots.push(sum(x.sets.filter(s=>s.w===w).map(s=>s.r)))}
  const need=sum([...Array(n)].map((_,j)=>Math.max(0,top-(atW[j]?.r??0))));
  const reps=[...Array(n)].map((_,j)=>Math.min(top,lastReps(j)));
  if(streak>=4&&tots[0]<=Math.max(...tots.slice(1)))return{...base,w,reps,status:'stall',streak,msg:`Stuck at ${fw(w)} for ${streak} sessions. Cap set 1, full rest, add 1 rep to the weakest set.`};
  return{...base,w,reps,status:'hold',need,msg:`Hold ${fw(w)}. ${need} more rep${need===1?'':'s'} across sets to reach ${top}/${top}/${top}.`};
}

// ---------- swim ----------
const SWIM_STROKES=['Free','Back','Breast','Fly','IM','Drill','Kick'];
function mainPiece(){
  const st=S.swim.steps[Math.min(S.swim.idx,S.swim.steps.length-1)];
  const per=S.swim.targetPace*st.dist/100;
  return{label:'Main: '+st.name,reps:st.reps,dist:st.dist,stroke:'Free',rest:st.rest,main:true,step:S.swim.idx,times:[],done:false,
    note:`5-6/10, same effort every rep. Target each ${st.dist}m under ${fmtT(per)}. Start slower than feels right`};
}
const pieceDist=p=>(p.reps||0)*(p.dist||0);
function pieceSwimTime(p){const t=(p.times||[]).filter(x=>x>0);if(p.total>0)return p.total;return t.length?sum(t):null}
function piecePace(p){const t=(p.times||[]).filter(x=>x>0);if(t.length)return sum(t)/(t.length*p.dist)*100;if(p.total>0&&pieceDist(p))return p.total/pieceDist(p)*100;return null}
function swimDist(s){return sum((s.pieces||[]).filter(p=>p.done).map(pieceDist))}
function swimTime(s){if(s.totalTime)return s.totalTime;const t=(s.pieces||[]).filter(p=>p.done).map(pieceSwimTime).filter(Boolean);return t.length?sum(t):null}

// ---------- stats ----------
function setVolume(ex,s){if(ex.assist)return 0;return(+s.w||0)*(ex.perHand?2:1)*(+s.r||0)}
function sessionVolume(s){if(s.kind!=='gym')return 0;let v=0;for(const e of s.entries){const ex=S.exercises[e.ex];if(!ex)continue;for(const st of e.sets)if(st.done)v+=setVolume(ex,st)}return v}
function weekStats(mon){
  const dates=weekDates(mon);const ss=S.sessions.filter(s=>dates.includes(s.date));
  const muscles={};let vol=0,dist=0,swimT=0;
  for(const s of ss){if(s.kind==='gym'){vol+=sessionVolume(s);for(const e of s.entries){const ex=S.exercises[e.ex];if(!ex)continue;const n=e.sets.filter(x=>x.done).length;muscles[ex.muscle]=(muscles[ex.muscle]||0)+n}}else{dist+=swimDist(s);swimT+=swimTime(s)||0}}
  const planned=dates.map(plannedFor);
  return{mon:dates[0],gym:ss.filter(s=>s.kind==='gym').length,swim:ss.filter(s=>s.kind==='swim').length,
    planGym:planned.filter(t=>tplKind(t)==='gym').length,planSwim:planned.filter(t=>tplKind(t)==='swim').length,vol,dist,swimT,muscles,sessions:ss};
}
function lastNWeeks(n){const m=mondayOf(new Date());return[...Array(n)].map((_,i)=>weekStats(ymd(addDays(m,-7*(n-1-i)))))}

function bestOf(exId,sessionsFilter){
  const ex=S.exercises[exId];let bw=null,be=null,bwr=0,ber=null;const repsAt={};
  for(const x of exposures(exId))for(const s of x.sets){
    if(sessionsFilter&&!sessionsFilter(x))continue;
    const w=+s.w,r=+s.r;repsAt[w]=Math.max(repsAt[w]||0,r);
    if(r>=Math.min(ex.repMin,6)){if(bw==null||(ex.assist?w<bw:w>bw)||(w===bw&&r>bwr)){bw=w;bwr=r}}
    if(!ex.assist&&w>0){const e=e1rm(w*(ex.perHand?1:1),r);if(be==null||e>be){be=e;ber={w,r,date:x.date}}}
  }
  return{bw,bwr,be,ber,repsAt};
}
function sessionPRs(sess){
  const out=[];if(sess.kind!=='gym')return out;
  for(const e of sess.entries){
    const ex=S.exercises[e.ex];if(!ex)continue;const done=e.sets.filter(s=>s.done&&s.r>0);if(!done.length)continue;
    const prior=exposures(e.ex,sess.id).filter(x=>x.date<=sess.date);if(!prior.length)continue;
    const ps=prior.flatMap(x=>x.sets);const minR=Math.min(ex.repMin,6);
    const pw=ps.filter(s=>s.r>=minR).map(s=>+s.w);const cw=done.filter(s=>s.r>=minR).map(s=>+s.w);
    if(cw.length&&pw.length){
      const bp=ex.assist?Math.min(...pw):Math.max(...pw),bc=ex.assist?Math.min(...cw):Math.max(...cw);
      if(ex.assist?bc<bp:bc>bp){const r=Math.max(...done.filter(s=>+s.w===bc).map(s=>s.r));out.push({ex:ex.name,type:ex.assist?'Least assist':'Heaviest',txt:`${fw(bc)} × ${r}`,was:fw(bp)});continue}
    }
    if(!ex.assist&&ex.repMax<=12&&Math.max(...done.map(s=>+s.w))>=10){const pe=Math.max(...ps.map(s=>e1rm(+s.w,+s.r)));let bs=null;for(const s of done){const v=e1rm(+s.w,+s.r);if(+s.w>0&&v>pe+0.01&&(!bs||v>bs.v))bs={v,s}}
      if(bs){out.push({ex:ex.name,type:'Est. 1RM',txt:`${fw(bs.s.w)} × ${bs.s.r} ≈ ${Math.round(bs.v)}`,was:Math.round(pe)});continue}}
    for(const s of done){const prev=ps.filter(p=>+p.w===+s.w).map(p=>+p.r);if(prev.length&&s.r>Math.max(...prev)){out.push({ex:ex.name,type:'Rep PR',txt:`${fw(s.w)} × ${s.r}`,was:Math.max(...prev)});break}}
  }
  return out;
}
function swimPRs(sess){
  const out=[];if(sess.kind!=='swim')return out;
  const prior=S.sessions.filter(s=>s.kind==='swim'&&s.id!==sess.id&&s.date<=sess.date);
  const bestRep=(ss,d)=>{let b=null;for(const s of ss)for(const p of s.pieces||[])if(p.dist===d&&p.done&&p.stroke!=='Drill')for(const t of p.times||[])if(t>0&&(b==null||t<b))b=t;return b};
  for(const d of [50,100,200,400]){const c=bestRep([sess],d);if(c==null)continue;const p=bestRep(prior,d);if(p!=null&&c<p)out.push({ex:`Fastest ${d}m`,type:'Swim PR',txt:fmtT(c),was:p?fmtT(p):'first'})}
  const cd=swimDist(sess),pd=Math.max(0,...prior.map(swimDist));if(prior.length&&cd>pd)out.push({ex:'Longest swim',type:'Swim PR',txt:cd+'m',was:pd+'m'});
  return out;
}

// ---------- weekly review (auto coach) ----------
function weekReview(mon){
  const w=weekStats(mon);const lines=[];const dates=weekDates(mon);
  lines.push({k:w.gym>=w.planGym?'good':'bad',t:`Lifts ${w.gym}/${w.planGym}`});
  lines.push({k:w.swim>=w.planSwim?'good':(w.swim?'warn':'bad'),t:`Swims ${w.swim}/${w.planSwim}${w.dist?` · ${w.dist}m`:''}`});
  const ups=[],stalls=[],drops=[];
  const seen=new Set();
  for(const s of w.sessions.filter(s=>s.kind==='gym'))for(const e of s.entries){
    if(seen.has(e.ex))continue;seen.add(e.ex);
    const n=(S.templates[s.tpl]?.items.find(i=>i.ex===e.ex)?.sets)||3;
    const sg=suggest(e.ex,n,ymd(addDays(parseYmd(dates[6]),1)));
    const nm=S.exercises[e.ex]?.name;if(!nm)continue;
    if(sg.status==='up')ups.push(`${nm} ${fw(sg.from)}→${fw(sg.w)}`);else if(sg.status==='stall')stalls.push(`${nm} (${sg.streak} sessions at ${fw(sg.w)})`);else if(sg.status==='down')drops.push(nm);
  }
  const prs=w.sessions.flatMap(s=>s.kind==='gym'?sessionPRs(s):swimPRs(s));
  return{w,lines,ups,stalls,drops,prs};
}

// ---------- calendar (.ics) ----------
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function icsFold(line){const out=[];let cur='';for(const ch of line){if(new TextEncoder().encode(cur+ch).length>73){out.push(cur);cur=' '+ch}else cur+=ch}out.push(cur);return out.join('\r\n')}
function icsStamp(d){return`${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`}
function sessionDesc(tplId,date){
  const t=S.templates[tplId];if(!t)return'';
  if(t.kind==='gym')return t.items.map(it=>{const ex=S.exercises[it.ex];const sg=suggest(it.ex,it.sets,date);return`${ex.name}: ${it.sets}×${ex.repMin}-${ex.repMax} @ ${fw(sg.w)}${ex.assist?' assist':''}${sg.status==='up'?' ↑':''}`}).join('\n')+'\n\nTargets as of '+fmtShort(todayStr())+'. Open the app for live numbers.';
  return t.pieces.map(p=>{const q=p.main?mainPiece():p;return`${p.main?'Main set':q.label}: ${q.reps>1?q.reps+'×':''}${q.dist}m${q.rest?` (${q.rest}s rest)`:''}${p.main?` each under ${fmtT(S.swim.targetPace*q.dist/100)}`:''}`}).join('\n');
}
function buildIcs(items){
  const now=icsStamp(new Date());
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Training//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Training'];
  for(const it of items){
    const t=S.templates[it.tpl];const[hh,mm]=(it.time||'18:00').split(':').map(Number);
    const st=parseYmd(it.date);st.setHours(hh,mm,0,0);const dur=t.kind==='gym'?75:45;const en=new Date(st.getTime()+dur*6e4);
    const loc=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
    L.push('BEGIN:VEVENT',`UID:${it.date}-${it.tpl}@nick-training`,`DTSTAMP:${now}`,`DTSTART:${loc(st)}`,`DTEND:${loc(en)}`,
      icsFold('SUMMARY:'+icsEsc((t.kind==='gym'?'🏋️ ':'🏊 ')+t.name)),icsFold('DESCRIPTION:'+icsEsc(sessionDesc(it.tpl,it.date))),
      'BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(t.name+' in 30 min'),'END:VALARM','END:VEVENT');
  }
  L.push('END:VCALENDAR');return L.join('\r\n');
}
function exportIcs(items,name){
  if(!items.length){toast('Nothing planned in that range');return}
  const blob=new Blob([buildIcs(items)],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!ios)a.download=name+'.ics';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  toast(ios?'Tap “Add All” to put it in Calendar':'Calendar file downloaded');
}
function planItems(from,days){const out=[];for(let i=0;i<days;i++){const d=ymd(addDays(parseYmd(from),i));const t=plannedFor(d);if(t&&!sessionsOn(d).some(s=>s.tpl===t))out.push({date:d,tpl:t,time:planTime(d)})}return out}

// ---------- backup ----------
async function exportBackup(){
  const json=JSON.stringify({...S,sync:S.sync?{...S.sync,token:undefined}:undefined},null,1);const name=`training-backup-${todayStr()}.json`;
  const file=new File([json],name,{type:'application/json'});
  S.settings.lastBackup=Date.now();save();
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Training backup'});toast('Backup shared. Save it to Files or iCloud Drive');render();return}}catch(e){if(e.name==='AbortError'){return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded');render();
}
function exportCsv(){
  const rows=[['date','session','kind','exercise','set','weight_kg','reps','rir','muscle','stroke','distance_m','time_s','session_rpe','notes']];
  for(const s of sessionsSorted().reverse()){
    if(s.kind==='gym')for(const e of s.entries){const ex=S.exercises[e.ex]||{name:e.ex};e.sets.forEach((st,j)=>{if(st.done)rows.push([s.date,s.name,'gym',ex.name+(ex.assist?' (assist kg)':''),j+1,st.w,st.r,st.rir??'',ex.muscle||'','','','',s.rpe??'',e.note||''])})}
    else for(const p of s.pieces||[]){if(!p.done)continue;if(p.times?.some(t=>t>0))p.times.forEach((t,j)=>rows.push([s.date,s.name,'swim',p.label,j+1,'','','','',p.stroke,p.dist,t||'',s.rpe??'',p.note||'']));else rows.push([s.date,s.name,'swim',p.label,'','',p.reps,'','',p.stroke,pieceDist(p),p.total||'',s.rpe??'',''])}
  }
  for(const b of S.bodyweight)rows.push([b.date,'Bodyweight','body','Bodyweight','',b.kg,'','','','','','','','']);
  const csv=rows.map(r=>r.map(c=>{c=String(c??'');return/[",\n]/.test(c)?`"${c.replace(/"/g,'""')}"`:c}).join(',')).join('\n');
  const file=new File([csv],`training-log-${todayStr()}.csv`,{type:'text/csv'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
}
function importBackup(file){
  const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.sessions||!d.exercises)throw 0;if(!await ask(`Replace everything on this phone with the backup (${d.sessions.length} sessions)?`))return;const keep=S.sync;S=d;if(keep)S.sync=keep;migrate();save();toast('Backup restored');view={tab:'today'};render()}catch(e){toast('That file is not a valid backup.')}};r.readAsText(file);
}

// ---------- charts (inline SVG) ----------
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function fmtK(v){return v>=10000?Math.round(v/1000)+'k':v>=1000?(v/1000).toFixed(1).replace('.0','')+'k':String(Math.round(v))}
function barChart(data,{h=150,colors=['var(--accent)'],fmt=fmtK,target=null,legend=null}={}){
  const W=340,pl=34,pb=20,pt=12;const n=data.length;const bw=(W-pl)/n;
  const mx=niceMax(Math.max(target||0,...data.map(d=>sum(d.v))));const y=v=>pt+(h-pt-pb)*(1-v/mx);
  let g='';for(const f of [0,.5,1]){const v=mx*f;g+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${pl-6}" y="${y(v)+3}" class="axis" text-anchor="end">${fmt(v)}</text>`}
  let b='';data.forEach((d,i)=>{let acc=0;const x=pl+i*bw+bw*.18,w=bw*.64;d.v.forEach((v,k)=>{if(!v)return;const y0=y(acc),y1=y(acc+v);acc+=v;b+=`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0,y0-y1)}" rx="3" fill="${colors[k%colors.length]}"${d.cur?'':' opacity=".9"'}><title>${esc(d.label)}: ${fmt(v)}</title></rect>`});
    if(sum(d.v)&&d.showVal!==false)b+=`<text x="${x+w/2}" y="${y(acc)-4}" class="val" text-anchor="middle">${fmt(sum(d.v))}</text>`;
    b+=`<text x="${x+w/2}" y="${h-5}" class="axis${d.cur?' cur':''}" text-anchor="middle">${esc(d.label)}</text>`});
  const tl=target?`<line x1="${pl}" x2="${W}" y1="${y(target)}" y2="${y(target)}" class="target"/>`:'';
  const lg=legend?`<div class="legend">${legend.map((l,k)=>`<span><i style="background:${colors[k]}"></i>${esc(l)}</span>`).join('')}${target?'<span><i class="dash"></i>target</span>':''}</div>`:'';
  return`<svg viewBox="0 0 ${W} ${h}" class="chart" role="img">${g}${tl}${b}</svg>${lg}`;
}
function lineChart(series,{h=170,fmt=v=>fw(v),invert=false,labels=[]}={}){
  const W=340,pl=34,pr=8,pb=20,pt=14;const all=series.flatMap(s=>s.pts.map(p=>p.y)).filter(v=>v!=null);
  if(all.length<1)return'<div class="empty">Not enough data yet</div>';
  let lo=Math.min(...all),hi=Math.max(...all);if(lo===hi){lo-=1;hi+=1}const padv=(hi-lo)*.12;lo-=padv;hi+=padv;
  const n=Math.max(...series.map(s=>s.pts.length));const x=i=>pl+(n<=1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1));
  const y=v=>{const f=(v-lo)/(hi-lo);return pt+(h-pt-pb)*(invert?f:1-f)};
  let g='';for(const f of [0,.5,1]){const v=lo+(hi-lo)*f;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${pl-6}" y="${y(v)+3}" class="axis" text-anchor="end">${fmt(v)}</text>`}
  let p='';series.forEach(s=>{const pts=s.pts.map((q,i)=>q.y==null?null:[x(i),y(q.y)]).filter(Boolean);
    if(pts.length>1)p+=`<polyline points="${pts.map(a=>a.join(',')).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"${s.dash?' stroke-dasharray="4 4"':''}/>`;
    pts.forEach((a,i)=>{p+=`<circle cx="${a[0]}" cy="${a[1]}" r="${i===pts.length-1?4:2.6}" fill="${s.color}"><title>${esc(s.pts[i]?.t||'')}</title></circle>`})});
  const lb=labels.length?`<text x="${x(0)}" y="${h-5}" class="axis">${esc(labels[0])}</text>${n>1?`<text x="${x(n-1)}" y="${h-5}" class="axis" text-anchor="end">${esc(labels[labels.length-1])}</text>`:''}`:'';
  const lg=series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  return`<svg viewBox="0 0 ${W} ${h}" class="chart">${g}${p}${lb}</svg>${lg}`;
}
function spark(vals,color='var(--accent)',invert=false){
  vals=vals.filter(v=>v!=null);if(vals.length<2)return'';const W=64,H=22;let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo-=1;hi+=1}
  const pts=vals.map((v,i)=>[i*W/(vals.length-1),invert?2+(H-4)*(v-lo)/(hi-lo):H-2-(H-4)*(v-lo)/(hi-lo)]);
  return`<svg viewBox="0 0 ${W} ${H}" class="spark"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="2.4" fill="${color}"/></svg>`;
}

// ---------- render: root ----------
function render(){
  const y=window.scrollY;const app=$('#app');
  let html='';
  if(view.tab==='session'&&S.draft)html=S.draft.kind==='gym'?renderGym():renderSwim();
  else if(view.tab==='summary')html=renderSummary();
  else if(view.tab==='progress')html=renderProgress();
  else if(view.tab==='plan')html=renderPlan();
  else if(view.tab==='body')html=renderBody();
  else if(view.tab==='more')html=renderMore();
  else if(view.tab==='exercise')html=renderExercise();

  else{view.tab='today';html=renderToday()}

  $('#nav').innerHTML=['today','progress','plan','body','more'].map(t=>`<button data-act="tab" data-t="${t}" class="${(view.tab===t||(t==='progress'&&view.tab==='exercise'))?'on':''}">${icon[t]}<span>${{today:'Today',progress:'Progress',plan:'Plan',body:'Body',more:'Data'}[t]}</span></button>`).join('');

// ---------- TODAY ----------
function renderToday(){
  const td=todayStr();const dates=weekDates(td);const ws=weekStats(dates[0]);
  const strip=dates.map(d=>{const t=plannedFor(d);const done=sessionsOn(d);const isT=d===td;const past=d<td;
    const st=done.length?'done':(t&&past?'miss':(isT?'today':''));const k=done[0]?.kind||tplKind(t);

  if(S.draft){main=`<div class="card hero resume"><div class="eyebrow">In progress</div><h2>${esc(S.draft.name)}</h2><p class="muted">${fmtDate(S.draft.date)} · started ${new Date(S.draft.startedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</p><button class="btn primary big" data-act="resume">Resume session</button></div>`}

  else main=`<div class="card hero restcard"><div class="eyebrow">Today</div><h2>Rest day</h2><p class="muted">Walk, eat, sleep. Or log something below if plans changed.</p></div>`;
  const missed=dates.filter(d=>d<td&&plannedFor(d)&&!sessionsOn(d).length);
  const missedHtml=missed.length&&!S.draft?`<div class="card warncard"><div class="row between"><div><div class="eyebrow">Not logged this week</div><div>${missed.map(d=>`${DOW[dowIdx(d)]} ${esc(S.templates[plannedFor(d)].name)}`).join(' · ')}</div></div></div><div class="chips mt">${missed.map(d=>`<button class="chip" data-act="start" data-t="${plannedFor(d)}" data-d="${d}">Log ${DOW[dowIdx(d)]}</button>`).join('')}</div><p class="tiny muted mt">Did it but forgot to log? Tap to back-fill. Skipped it? Fair enough, it'll show as missed.</p></div>`:'';
  const anyChips=Object.values(S.templates).map(x=>`<button class="chip ${x.kind}" data-act="start" data-t="${x.id}">${esc(x.name)}</button>`).join('')+`<button class="chip swim" data-act="quickswim">⚡ Quick swim</button>`;
  // backup nag
  const lb=S.settings.lastBackup;const bdays=lb?Math.floor((Date.now()-lb)/864e5):null;
  const nag=(bdays==null||bdays>=7)&&S.sessions.filter(s=>!s.imported).length?`<button class="card nag" data-act="backup"><b>Back up your data</b><span>${bdays==null?'Never backed up':`Last backup ${bdays} days ago`}. One tap, saves to Files/iCloud.</span></button>`:'';
  // weekly review: on Mon/Tue show last week's
  const lastMon=ymd(addDays(parseYmd(dates[0]),-7));

  const sw=S.swim.steps[Math.min(S.swim.idx,S.swim.steps.length-1)];

  <div class="grid2">
   <button class="card mini" data-act="tab" data-t="body"><div class="eyebrow">Bodyweight</div><div class="big">${bw.length?fw(bw.at(-1).kg)+'<small> kg</small>':'–'}</div><div class="tiny muted">${bwToday?'Logged today ✓':'Tap to log today'}</div></button>
   <button class="card mini" data-act="tab" data-t="progress" data-sub="swim"><div class="eyebrow">Swim ladder</div><div class="big">${esc(sw.name)}</div><div class="tiny muted">each ${sw.dist}m under ${fmtT(S.swim.targetPace*sw.dist/100)}</div></button>

function heroCard(t,date){

// ---------- PROGRESS ----------
function renderProgress(){
  const sub=view.sub||'overview';
  const tabs=`<div class="seg big">${[['overview','Overview'],['lifts','Lifts'],['swim','Swim']].map(([k,l])=>`<button data-act="sub" data-v="${k}" class="${sub===k?'on':''}">${l}</button>`).join('')}</div>`;
  let body='';
  if(sub==='overview'){
    let W=lastNWeeks(8);while(W.length>4&&!W[0].gym&&!W[0].swim)W.shift();const lbl=w=>fmtShort(w.mon).replace(' ','\u00a0');
    const cur=ymd(mondayOf(new Date()));
    const thisW=W.at(-1),prevW=W.at(-2);const ms=['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes','Calves','Abs'];
    const mx=Math.max(1,...ms.map(m=>Math.max(thisW.muscles[m]||0,prevW.muscles[m]||0)));
    const allPR=sessionsSorted().filter(s=>!s.imported||true).slice(0,40).flatMap(s=>(s.kind==='gym'?sessionPRs(s):swimPRs(s)).map(p=>({...p,date:s.date}))).slice(0,8);
    body=`<div class="card"><div class="eyebrow">Sessions per week</div>${barChart(W.map(w=>({label:lbl(w),v:[w.gym,w.swim],cur:w.mon===cur})),{colors:['var(--accent)','var(--swim)'],fmt:v=>String(Math.round(v)),target:S.settings.goalGym+S.settings.goalSwim,legend:['Lifts','Swims']})}</div>
    <div class="card"><div class="eyebrow">Lifting volume (kg × reps)</div>${barChart(W.map(w=>({label:lbl(w),v:[w.vol],cur:w.mon===cur})))}<p class="tiny muted">Machine stack kg, so it's for comparing weeks, not bragging. Dumbbells count both hands.</p></div>
    <div class="card"><div class="eyebrow">Hard sets per muscle · this week vs last</div>${ms.map(m=>{const a=thisW.muscles[m]||0,b=prevW.muscles[m]||0;return`<div class="mrow"><span>${m}</span><div class="mbar"><i class="prev" style="width:${b/mx*100}%"></i><i style="width:${a/mx*100}%"></i></div><b>${a}</b></div>`}).join('')}<p class="tiny muted">Grey = last week. 10-20 sets per muscle per week is the usual hypertrophy zone.</p></div>
    <div class="card"><div class="eyebrow">Swim distance per week (m)</div>${barChart(W.map(w=>({label:lbl(w),v:[w.dist],cur:w.mon===cur})),{colors:['var(--swim)']})}</div>
    ${reviewCard(cur,'This week so far')}
    ${achievementsCard()}
    <div class="card"><div class="eyebrow">Recent PRs</div>${allPR.length?allPR.map(p=>`<div class="listrow static"><span class="grow"><b>${esc(p.ex)}</b><span class="tiny muted">${fmtShort(p.date)} · ${esc(p.type)}</span></span><b>${esc(p.txt)}</b></div>`).join(''):'<p class="muted">PRs show up here once you beat something.</p>'}</div>`;
  }else if(sub==='lifts'){
    const used=Object.values(S.exercises).filter(ex=>exposures(ex.id).length);
    const groups={};used.forEach(ex=>(groups[ex.muscle]=groups[ex.muscle]||[]).push(ex));
    body=Object.entries(groups).map(([m,list])=>`<div class="card"><div class="eyebrow">${esc(m)}</div>${list.map(ex=>{const xs=exposures(ex.id).slice(0,8).reverse();const tops=xs.map(x=>{const w=workW(x.sets,ex.assist);return ex.assist?w:Math.max(...x.sets.map(s=>e1rm(+s.w,+s.r)))});
      const n=(Object.values(S.templates).find(t=>t.items?.some(i=>i.ex===ex.id))?.items.find(i=>i.ex===ex.id)?.sets)||3;const sg=suggest(ex.id,n);
      return`<button class="listrow" data-act="exinfo" data-ex="${ex.id}"><span class="grow"><b>${esc(ex.name)}</b><span class="tiny muted">${esc(sg.last?.str||'')}</span></span>${spark(tops,ex.assist?'var(--good)':'var(--accent)',ex.assist)}<span class="wcol">${statusBadge(sg.status)}<b>${fw(sg.w)}</b></span></button>`}).join('')}</div>`).join('');
  }else{
    const sw=S.sessions.filter(s=>s.kind==='swim').sort((a,b)=>a.date.localeCompare(b.date));
    const mains=sw.flatMap(s=>(s.pieces||[]).filter(p=>p.main&&p.done&&piecePace(p)).map(p=>({date:s.date,pace:piecePace(p),label:p.label})));
    const steps=S.swim.steps;
    const W=lastNWeeks(8);
    const best=d=>{let b=null;for(const s of sw)for(const p of s.pieces||[])if(p.dist===d&&p.done&&p.stroke!=='Drill')for(const t of p.times||[])if(t>0&&(b==null||t<b.t))b={t,date:s.date};return b};
    body=`<div class="card"><div class="eyebrow">Ladder to 400m continuous</div><div class="ladder">${steps.map((st,i)=>`<div class="rung ${i<S.swim.idx?'done':i===S.swim.idx?'cur':''}"><b>${esc(st.name)}</b><span>${i<S.swim.idx?'✓':i===S.swim.idx?'now':''}</span></div>`).join('')}</div>
      <p class="tiny muted">Every rep under ${fmtT(S.swim.targetPace)}/100m on the main set moves you up a rung automatically.</p>
      <div class="row gap mt"><button class="btn ghost sm" data-act="ladder" data-v="-1">← Step back</button><button class="btn ghost sm" data-act="ladder" data-v="1">Step up →</button><label class="mini-in"><span>target /100m</span><input data-bind="tpace" inputmode="numeric" value="${fmtT(S.swim.targetPace)}"></label></div></div>
    <div class="card"><div class="eyebrow">Main-set pace per 100m (lower is faster)</div>${lineChart([{name:'pace',color:'var(--swim)',pts:mains.map(m=>({y:m.pace,t:`${fmtShort(m.date)} ${m.label}: ${fmtT(m.pace)}`}))},{name:'target',color:'var(--muted)',dash:true,pts:mains.map(()=>({y:S.swim.targetPace}))}],{fmt:fmtT,invert:true,labels:mains.map(m=>fmtShort(m.date))})}</div>
    <div class="card"><div class="eyebrow">Swims per week vs goal of ${S.settings.goalSwim}</div>${barChart(W.map(w=>({label:fmtShort(w.mon),v:[w.swim]})),{colors:['var(--swim)'],fmt:v=>String(Math.round(v)),target:S.settings.goalSwim})}</div>
    <div class="card"><div class="eyebrow">Swim PRs</div>${[50,100,200,400].map(d=>{const b=best(d);return`<div class="listrow static"><span class="grow">Fastest ${d}m rep</span><b>${b?fmtT(b.t):'–'}</b><span class="tiny muted">${b?fmtShort(b.date):''}</span></div>`}).join('')}<div class="listrow static"><span class="grow">Longest session</span><b>${Math.max(0,...sw.map(swimDist))}m</b></div></div>`;
  }
  return`<header class="top"><div><div class="eyebrow">Progress</div><h1>${{overview:'The numbers',lifts:'Every lift',swim:'Swimming'}[sub]}</h1></div></header>${tabs}${body}`;
}

// ---------- BODY ----------
function renderBody(){
  const bw=S.bodyweight.slice().sort((a,b)=>a.date.localeCompare(b.date));const td=todayStr();
  const ma=bw.map((b,i)=>{const win=bw.filter(x=>daysBetween(x.date,b.date)>=0&&daysBetween(x.date,b.date)<7);return sum(win.map(x=>x.kg))/win.length});
  const wkAvg=w=>{const ds=weekDates(w);const v=bw.filter(b=>ds.includes(b.date));return v.length?sum(v.map(b=>b.kg))/v.length:null};
  const thisAvg=wkAvg(td),lastAvg=wkAvg(ymd(addDays(parseYmd(td),-7)));
  const tr=thisAvg!=null&&lastAvg!=null?thisAvg-lastAvg:null;

// ---------- rest timer ----------
function beep(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.3,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.5);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.5);navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startRest(sec,label){restT={end:Date.now()+sec*1000,total:sec,label};$('#rest').classList.add('on');tickRest()}
function tickRest(){
  const el=$('#rest');if(!restT){el.classList.remove('on');return}
  const left=Math.ceil((restT.end-Date.now())/1000);
  if(left<=0&&!restT.beeped){restT.beeped=true;beep()}
  el.innerHTML=`<div class="rbar"><i style="width:${Math.max(0,Math.min(100,left/restT.total*100))}%"></i></div><div class="rrow"><button data-act="rest" data-v="-15">−15</button><div class="rt"><b class="${left<=0?'go':''}">${left>0?fmtT(left):'GO'}</b><span>${esc(restT.label||'rest')}</span></div><button data-act="rest" data-v="15">+15</button><button data-act="rest" data-v="x">✕</button></div>`;
  if(left<-20){restT=null;el.classList.remove('on')}
}
function tickElapsed(){const e=$('#elapsed');if(e&&S.draft)e.textContent=fmtT((Date.now()-S.draft.startedAt)/1000)}
setInterval(()=>{if(restT)tickRest();tickElapsed()},500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(restT)tickRest();if(view.tab==='today')render()}});

// ---------- actions ----------
async function startSession(t,date){
  date=date||todayStr();
  if(S.draft&&!await ask(`Discard the ${S.draft.name} in progress?`,'Discard','danger'))return;
  closeSheet();const tp=S.templates[t];const d={id:uid(),tpl:t,kind:tp.kind,name:tp.name,date,startedAt:Date.now()};
  if(tp.kind==='gym')d.entries=tp.items.map(it=>newEntry(it.ex,it.sets,it.warmup,date));
  else d.pieces=tp.pieces.map(p=>p.main?mainPiece():Object.assign(clone(p),{times:[],done:false}));
  S.draft=d;save();view={tab:'session'};render();window.scrollTo(0,0);
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
}
function finishSheet(){
  const d=S.draft;const done=d.kind==='gym'?sum(d.entries.map(e=>e.sets.filter(s=>s.done).length)):d.pieces.filter(p=>p.done).length;
  const pending=d.kind==='gym'?sum(d.entries.map(e=>e.sets.filter(s=>!s.done).length)):0;
  openSheet(`<h3>Finish ${esc(d.name)}</h3>
   ${done===0?`<p class="warn-t tiny">Nothing ticked yet. Tick sets (or “✓ All as shown”) before saving.</p>`:''}
   ${pending?`<p class="tiny muted">${pending} set${pending>1?'s':''} not ticked will be left out.</p>`:''}
   <label class="field"><span>Date</span><input type="date" id="fin-date" value="${d.date}"></label>
   ${d.kind==='swim'?`<label class="field"><span>Total time from watch (optional)</span><input id="fin-total" inputmode="numeric" placeholder="e.g. 3215 = 32:15" value="${d.totalTime?fmtT(d.totalTime):''}"></label>`:''}
   <div class="field"><span>How hard was it? (session RPE)</span><div class="rpe">${[5,6,7,8,9,10].map(v=>`<button data-act="finrpe" data-v="${v}" class="${d.rpe===v?'on':''}">${v}</button>`).join('')}</div></div>
   <label class="field"><span>Notes</span><textarea id="fin-notes" rows="2" placeholder="Machine settings, how you felt, anything weird">${esc(d.notes||'')}</textarea></label>
   <button class="btn primary big full" data-act="savesess"${done===0?' disabled':''}>Save</button>
   <button class="btn danger full mt" data-act="discard">Discard session</button>`);
}
function saveSession(){
  const d=S.draft;d.date=$('#fin-date').value||d.date;d.notes=$('#fin-notes').value.trim();
  if(d.kind==='swim'){const t=parseT($('#fin-total')?.value);d.totalTime=t||null}
  d.endedAt=d.endedAt||Date.now();
  const s=clone(d);delete s.editingId;
  if(s.kind==='gym'){s.entries=s.entries.map(e=>({...e,sets:e.sets.filter(x=>x.done).map(x=>({...x,w:x.w===''?null:+x.w,r:+x.r}))})).filter(e=>e.sets.length)}
  else s.pieces=s.pieces.filter(p=>p.done);
  if(d.editingId){s.id=d.editingId;S.sessions=S.sessions.filter(x=>x.id!==d.editingId)}
  S.sessions.push(s);
  const prs=s.kind==='gym'?sessionPRs(s):swimPRs(s);
  let ladderMsg='';
  if(s.kind==='swim'){const mp=s.pieces.find(p=>p.main&&p.step===S.swim.idx);
    if(mp){const t=(mp.times||[]).filter(x=>x>0);const tgt=S.swim.targetPace*mp.dist/100;
      if(t.length<mp.reps)ladderMsg=`Main set logged without all ${mp.reps} times, so the ladder stays at ${S.swim.steps[S.swim.idx].name}. Times are what move it.`;
      else if(t.every(x=>x<=tgt)){if(S.swim.idx<S.swim.steps.length-1){S.swim.idx++;ladderMsg=`Every rep under ${fmtT(tgt)}. Next main set: ${S.swim.steps[S.swim.idx].name}.`}else ladderMsg=`400 continuous at target pace. Lower the target pace in Progress → Swim to keep climbing.`}
      else ladderMsg=`${t.filter(x=>x>tgt).length} of ${t.length} reps over ${fmtT(tgt)}. Same set next time.`}}
  S.draft=null;restT=null;tickRest();save();closeSheet();
  view={tab:'summary',sid:s.id,prs,ladderMsg};render();window.scrollTo(0,0);
}

  newtpl:(a)=>{const id='T'+uid();const k=a.dataset.k;S.templates[id]=k==='gym'?{id,name:'New session',short:'New',kind:'gym',items:[]}:{id,name:'Swim: new',short:'Swim',kind:'swim',pieces:[{label:'Warm-up',reps:1,dist:200,stroke:'Free',rest:30}]};save();render();openSheet(tplEditor(id))},
  deltpl:async(a)=>{if(!await ask('Delete this session? Logged history stays.','Delete','danger'))return;const id=a.dataset.t;delete S.templates[id];S.plan.days.forEach(d=>{if(d.tpl===id)d.tpl=null});for(const k in S.plan.overrides)if(S.plan.overrides[k]===id)S.plan.overrides[k]='REST';save();closeSheet();render()},
  tplmove:(a)=>{const t=S.templates[a.dataset.t];const i=+a.dataset.i,j=i+(+a.dataset.v);if(j<0||j>=t.items.length)return;[t.items[i],t.items[j]]=[t.items[j],t.items[i]];save();openSheet(tplEditor(a.dataset.t));render()},
  tpldel:(a)=>{const t=S.templates[a.dataset.t];(t.items||t.pieces).splice(+a.dataset.i,1);save();openSheet(tplEditor(a.dataset.t));render()},
  tpladdpiece:(a)=>{S.templates[a.dataset.t].pieces.push({label:'Set',reps:4,dist:50,stroke:'Free',rest:20});save();openSheet(tplEditor(a.dataset.t))},
  tpladdmain:(a)=>{S.templates[a.dataset.t].pieces.push({label:'Main set',main:true});save();openSheet(tplEditor(a.dataset.t))},
  closesheet:()=>{closeSheet();render()},
  ladder:(a)=>{S.swim.idx=Math.max(0,Math.min(S.swim.steps.length-1,S.swim.idx+(+a.dataset.v)));save();render()},
  bwadj:(a)=>{const i=$('#bwval');i.value=Math.max(0,((+i.value||0)+(+a.dataset.v))).toFixed(1)},
  bwsave:()=>{const v=parseFloat(String($('#bwval').value).replace(',','.'));if(!(v>25&&v<300)){toast('That does not look like a weight in kg');return}const td=todayStr();S.bodyweight=S.bodyweight.filter(b=>b.date!==td);S.bodyweight.push({date:td,kg:+v.toFixed(1)});save();render();toast('Weight saved')},
  bwdel:(a)=>{S.bodyweight=S.bodyweight.filter(b=>b.date!==a.dataset.d);save();render()},
  backup:()=>exportBackup(),csv:()=>exportCsv(),
  effort:(a)=>{S.settings.effort=a.dataset.v;save();render()},
  reset:async()=>{if(!await ask('Wipe everything and go back to the starting program? This cannot be undone. Back up first.','Wipe it','danger'))return;S=seedState();save();view={tab:'today'};render()},
};
function exHistorySheet(id){const ex=S.exercises[id];const xs=exposures(id).slice(0,8);return`<h3>${esc(ex.name)}</h3>${xs.map(x=>`<div class="listrow static"><span class="grow">${fmtDate(x.date)}</span><b>${fw(workW(x.sets,ex.assist))} × ${x.sets.map(s=>s.r).join('/')}</b></div>`).join('')||'<p class="muted">No history yet</p>'}`}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a||a.disabled)return;
  if(a.closest('#sheet')&&a.dataset.act!=='closesheet'&&!a.closest('.sheet-body'))return;
  e.preventDefault();const f=ACT[a.dataset.act];if(f)f(a,e);
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.classList.contains('sheet-grab'))closeSheet()});
document.addEventListener('focusin',e=>{if(e.target.matches('.set input,.times input'))setTimeout(()=>e.target.select(),0)});
document.addEventListener('input',e=>{const t=e.target;const b=t.dataset.bind;if(!b)return;
  if(b==='exsearch'){const q=t.value.toLowerCase();document.querySelectorAll('#exlist .listrow').forEach(r=>r.style.display=r.dataset.name.includes(q)?'':'none');return}
  if(b==='goals'){S.settings.goals=t.value;save()}
});
document.addEventListener('change',e=>{const t=e.target;const b=t.dataset.bind;if(!b)return;const d=t.dataset;const v=t.value;
  const num=x=>{const n=parseFloat(String(x).replace(',','.'));return isNaN(n)?'':n};
  switch(b){
    case'w':S.draft.entries[d.i].sets[d.j].w=num(v);break;
    case'r':S.draft.entries[d.i].sets[d.j].r=num(v);break;
    case'time':{const p=S.draft.pieces[d.i];p.times=p.times||[];p.times[d.j]=parseT(v);if(p.times.filter(x=>x>0).length===p.reps)p.done=true;save();view.keepScroll=true;render();return}
    case'ptotal':S.draft.pieces[d.i].total=parseT(v);break;
    case'preps':S.draft.pieces[d.i].reps=Math.max(1,+v||1);save();view.keepScroll=true;render();return;
    case'pdist':S.draft.pieces[d.i].dist=+v||0;break;
    case'prest':S.draft.pieces[d.i].rest=+v||0;break;
    case'ovr':S.plan.overrides[d.d]=v||'REST';save();closeSheet();render();return;
    case'defday':S.plan.days[d.i].tpl=v||null;save();render();return;
    case'deftime':S.plan.days[d.i].time=v;break;
    case'goalGym':S.settings.goalGym=+v||0;break;
    case'goalSwim':S.settings.goalSwim=+v||0;break;
    case'tplname':S.templates[d.t].name=v;S.templates[d.t].short=v.replace(/^Swim:\s*/,'').slice(0,6);break;
    case'tplsets':S.templates[d.t].items[d.i].sets=Math.max(1,+v||1);break;
    case'plabel':S.templates[d.t].pieces[d.i].label=v;break;
    case'tpreps':S.templates[d.t].pieces[d.i].reps=+v||1;break;
    case'tpdist':S.templates[d.t].pieces[d.i].dist=+v||0;break;
    case'tpace':{const p=parseT(v);if(p>30&&p<600){S.swim.targetPace=p;save();render()}return}
    case'bwgoal':S.settings.bwGoal=num(v)||null;save();render();return;
    case'import':if(t.files[0])importBackup(t.files[0]);return;
  }
  save();
});


// ================= v2: coach overrides, session UX, rings, streaks, achievements, GitHub sync =================

// ---- coach-aware suggestion ----
function suggest(exId,n,forDate,excludeId){
  const sg=suggestBase(exId,n,forDate,excludeId);
  const ct=S.coach&&S.coach.targets&&S.coach.targets[exId];
  if(!ct||ct.w==null)return sg;
  if(sg.last&&ct.set&&sg.last.date>=ct.set)return sg; // coach target used once, then the engine takes over again
  const ex=S.exercises[exId];
  return{...sg,from:+ct.w!==+sg.w?sg.w:sg.from,w:+ct.w,reps:ct.reps||Array(n).fill(ex.repMin),status:'coach',msg:'Coach: '+(ct.note||`use ${fw(ct.w)} today`)};
}

// ---- session helpers ----
function rampText(e,i){
  const ex=S.exercises[e.ex];const w=+(e.sets[0]&&e.sets[0].w);
  if(i>1||ex.assist||!(w>0))return e.warmup?'warm-up '+e.warmup:'';
  const r=x=>Math.max(ex.inc,Math.round(x/ex.inc)*ex.inc);
  const u=ex.perHand?'kg each':'kg';return`ramp ${fw(r(w*.5))}${u}×8 → ${fw(r(w*.75))}${u}×4`;
}
function etaText(d){
  let secs=0;d.entries.forEach(e=>{const ex=S.exercises[e.ex];e.sets.forEach(s=>{if(!s.done)secs+=40+(ex?ex.rest:90)})});
  if(!secs)return'all sets done';const m=Math.round(secs/60);return`~${m} min left`;
}
let wl=null;
async function wake(on){try{if(on&&!wl&&navigator.wakeLock&&document.visibilityState==='visible'){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}else if(!on&&wl){const w=wl;wl=null;await w.release()}}catch(e){}}

// ---- rings / streaks ----
function ring(v,goal,color,label){
  const p=Math.min(1,goal?v/goal:0);const R=25,C=2*Math.PI*R;
  return`<div class="ringc"><div class="ringw"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="${R}" class="rbg"/><circle cx="32" cy="32" r="${R}" class="rfg" style="stroke:${color}" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"/></svg><div class="rv2"><b>${v}</b><small>/${goal}</small></div></div><span>${label}</span></div>`;
}
let _stk=null,_stkKey='';
function streaks(){
  const key=S.sessions.length+'|'+todayStr()+'|'+S.settings.goalGym+'|'+S.settings.goalSwim;if(_stk&&_stkKey===key)return _stk;
  const mon=mondayOf(new Date());const weeks=[];for(let i=0;i<40;i++)weeks.push(weekStats(ymd(addDays(mon,-7*i))));
  const run=(hit)=>{let cur=0;const k=hit(weeks[0])?0:1;for(let i=k;i<weeks.length;i++){if(hit(weeks[i]))cur++;else break}let best=0,r=0;for(const w of weeks.slice().reverse()){r=hit(w)?r+1:0;best=Math.max(best,r)}return{cur,best}};
  _stk={lift:run(w=>w.gym>=S.settings.goalGym),swim:run(w=>w.swim>=S.settings.goalSwim),perfect:run(w=>w.gym>=S.settings.goalGym&&w.swim>=S.settings.goalSwim)};_stkKey=key;return _stk;
}
function todayTop(ws){
  const st=streaks();
  const flame=st.lift.cur?`<span class="pill hot">🔥 ${st.lift.cur}-week lifting streak</span>`:(st.lift.best?`<span class="pill">Best lifting streak: ${st.lift.best} weeks. Start a new one this week</span>`:'');
  const sflame=st.swim.cur?`<span class="pill swimpill">🌊 ${st.swim.cur}-week swim streak</span>`:'';
  return`<div class="card rings"><div class="ringrow">${ring(ws.gym,S.settings.goalGym,'var(--accent)','lifts')}${ring(ws.swim,S.settings.goalSwim,'var(--swim)','swims')}
   <div class="ringstat"><b>${fmtK(ws.vol)}</b><span>kg lifted</span><b>${ws.dist}</b><span>m swum</span></div></div>
   ${flame||sflame?`<div class="chips">${flame}${sflame}</div>`:''}</div>`;
}

// ---- achievements ----
function achievements(){
  const ss=S.sessions,gym=ss.filter(s=>s.kind==='gym'),sw=ss.filter(s=>s.kind==='swim');
  const nPR=ss.reduce((a,s)=>a+(s.kind==='gym'?sessionPRs(s).length:swimPRs(s).length),0);
  const maxVol=Math.max(0,...gym.map(sessionVolume));const st=streaks();const W=lastNWeeks(30);
  const g=S.settings.goalGym,sg=S.settings.goalSwim;
  const bw=S.bodyweight.map(b=>b.date).sort();let bwRun=0,bwBest=0;for(let i=0;i<bw.length;i++){bwRun=i&&daysBetween(bw[i-1],bw[i])===1?bwRun+1:1;bwBest=Math.max(bwBest,bwRun)}
  const pu=exposures('pullup').flatMap(x=>x.sets.filter(s=>s.r>=6).map(s=>+s.w));const puBest=pu.length?Math.min(...pu):99;
  const did400=sw.some(s=>(s.pieces||[]).some(p=>p.done&&p.dist===400&&p.reps===1&&p.stroke!=='Drill'&&((p.times&&p.times[0]>0)||p.total>0)));
  return[
    ['🏋️','Full lifting week',`${g} lifts in one week`,W.some(w=>w.gym>=g)],
    ['🏊','Full swim week',`${sg} swims in one week`,W.some(w=>w.swim>=sg)],
    ['💯','Perfect week',`${g} lifts + ${sg} swims`,W.some(w=>w.gym>=g&&w.swim>=sg)],
    ['🔥','On a roll','3-week lifting streak',st.lift.best>=3],
    ['⚡','Unbreakable','8-week lifting streak',st.lift.best>=8],
    ['🌊','Water habit','3-week swim streak',st.swim.best>=3],
    ['🥇','First PR','Beat any number',nPR>=1],
    ['🏆','PR machine','25 PRs',nPR>=25],
    ['🧱','10 tonnes','10,000 kg in one session',maxVol>=10000],
    ['📈','Fifty','50 sessions logged',ss.length>=50],
    ['💪','Hundred','100 sessions logged',ss.length>=100],
    ['🐟','4×100 cleared','Every 100 under target',S.swim.idx>=2],
    ['🐠','2×200 cleared','Every 200 under target',S.swim.idx>=3],
    ['🐬','400 non-stop','Swim 400m continuous',did400],
    ['🧗','Less help','Pull-ups at 17 assist or less',puBest<=17],
    ['⚖️','Weigh-in week','7 mornings in a row',bwBest>=7],
  ];
}
function achievementsCard(){
  const a=achievements();const got=a.filter(x=>x[3]).length;
  return`<div class="card"><div class="row between"><div class="eyebrow">Achievements</div><span class="tiny muted">${got}/${a.length}</span></div>
   <div class="badges">${a.map(([e,t,d,ok])=>`<div class="bdg ${ok?'got':''}"><span class="be">${e}</span><b>${esc(t)}</b><small>${esc(d)}</small></div>`).join('')}</div></div>`;
}

// ---- coach card ----
function coachCard(){
  const c=S.coach;if(!c||!c.message)return'';
  const fresh=c.date&&daysBetween(c.date,todayStr())<=10;if(!fresh)return'';
  const tg=Object.entries(c.targets||{}).filter(([id,t])=>S.exercises[id]&&!(exposures(id)[0]&&t.set&&exposures(id)[0].date>=t.set));
  return`<div class="card coachcard"><div class="eyebrow">From your coach · ${fmtShort(c.date)}</div><p>${esc(c.message).replace(/\n/g,'<br>')}</p>
   ${tg.length?`<div class="chips">${tg.map(([id,t])=>`<span class="pill">${esc(S.exercises[id].name)}: ${fw(t.w)}</span>`).join('')}</div>`:''}</div>`;
}

// ---- GitHub sync (logs out, coach notes in) ----
const GH='https://api.github.com';
function b64(str){const by=new TextEncoder().encode(str);let bin='';for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin)}
async function gh(path,opt={}){
  const r=await fetch(GH+path,{...opt,headers:{Authorization:'Bearer '+S.sync.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});
  if(!r.ok&&r.status!==404){let m='';try{m=(await r.json()).message}catch(e){}throw new Error(r.status===401?'Token rejected. Make a new one.':r.status===403?'Token lacks permission (needs Contents: read and write).':`${r.status} ${m}`)}
  return r;
}
async function putFile(path,content,msg){
  const base=`/repos/${S.sync.owner}/${S.sync.repo}/contents/${path}`;let sha;
  const g=await gh(base+'?t='+Date.now());if(g.status===200)sha=(await g.json()).sha;
  await gh(base,{method:'PUT',body:JSON.stringify({message:msg,content:b64(content),sha})});
}
function syncPayload(){
  const{sync,draft,...rest}=S;
  return JSON.stringify({exportedAt:new Date().toISOString(),app:'nick-training',...rest},null,1);
}
function weekSummaryMd(){
  const mon=ymd(mondayOf(new Date()));const r=weekReview(mon);const lw=weekReview(ymd(addDays(parseYmd(mon),-7)));
  const fmtR=(t,x)=>`## ${t} (${fmtShort(x.w.mon)})\n- Lifts ${x.w.gym}/${x.w.planGym}, swims ${x.w.swim}/${x.w.planSwim}, ${Math.round(x.w.vol)} kg volume, ${x.w.dist} m swum\n${x.ups.length?'- Moving up: '+x.ups.join('; ')+'\n':''}${x.stalls.length?'- Stuck: '+x.stalls.join('; ')+'\n':''}${x.prs.length?'- PRs: '+x.prs.map(p=>p.ex+' '+p.txt).join('; ')+'\n':''}`;
  const sess=sessionsSorted().slice(0,8).map(s=>`- ${s.date} ${s.name}: `+(s.kind==='gym'?s.entries.map(e=>`${(S.exercises[e.ex]||{}).name} ${fw(e.sets[0]&&e.sets[0].w)}×${e.sets.map(x=>x.r).join('/')}`).join(', '):(s.pieces||[]).map(p=>`${p.label} ${p.reps>1?p.reps+'×':''}${p.dist}m${p.times&&p.times.some(t=>t>0)?' ['+p.times.filter(t=>t>0).map(fmtT).join(' ')+']':''}`).join(', '))+(s.notes?` (note: ${s.notes})`:'')).join('\n');
  const bw=S.bodyweight.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-10).map(b=>`${b.date} ${b.kg}`).join(', ');
  return`# Training summary, synced ${new Date().toLocaleString('en-GB')}\n\n${fmtR('This week',r)}\n${fmtR('Last week',lw)}\n## Last 8 sessions\n${sess}\n\n## Bodyweight\n${bw||'none yet'}\n\nSwim ladder: ${S.swim.steps[S.swim.idx].name}, target ${fmtT(S.swim.targetPace)}/100m\n`;
}
let syncT=null,syncing=false;
function syncSoon(){if(!S.sync||!S.sync.token||!S.sync.owner||S.draft)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(true),4000)}
async function syncNow(quiet){
  if(!S.sync||!S.sync.token||!S.sync.owner||syncing)return;syncing=true;
  try{
    await putFile('log.json',syncPayload(),'Sync '+new Date().toISOString().slice(0,16));
    await putFile('summary.md',weekSummaryMd(),'Summary '+todayStr());
    S.sync.lastPush=Date.now();S.sync.error=null;await pullCoach(true);saveLocal();if(!quiet)toast('Synced');
  }catch(e){S.sync.error=e.message;saveLocal();if(!quiet)toast('Sync failed: '+e.message)}
  syncing=false;if(view.tab==='more')render();
}
async function pullCoach(quiet){
  if(!S.sync||!S.sync.token||!S.sync.owner)return;
  try{
    const r=await gh(`/repos/${S.sync.owner}/${S.sync.repo}/contents/coach.json?t=${Date.now()}`,{headers:{Accept:'application/vnd.github.raw+json'}});
    if(r.status!==200)return;const c=JSON.parse(await r.text());
    const isNew=!S.coach||S.coach.version!==c.version;S.coach=c;S.sync.lastPull=Date.now();
    if(isNew&&c.version&&S.coachApplied!==c.version){
      if(c.planOverrides)Object.assign(S.plan.overrides,c.planOverrides);
      if(c.swim){if(c.swim.idx!=null)S.swim.idx=c.swim.idx;if(c.swim.targetPace)S.swim.targetPace=c.swim.targetPace}
      if(c.exercises)for(const[id,v]of Object.entries(c.exercises))S.exercises[id]=Object.assign(S.exercises[id]||{id},v);
      S.coachApplied=c.version;saveLocal();toast('New note from your coach');if(view.tab==='today')render();
    }else saveLocal();
  }catch(e){if(!quiet)toast('Could not fetch coach notes: '+e.message)}
}
async function connectSync(){
  const token=$('#sy-token').value.trim();const repo=($('#sy-repo').value.trim()||'training-data').replace(/^.*\//,'');
  if(!token){toast('Paste the token first');return}
  S.sync={token,repo};
  try{const u=await (await gh('/user')).json();S.sync.owner=u.login;
    const r=await gh(`/repos/${u.login}/${repo}`);if(r.status===404){S.sync.error=`Can't see ${u.login}/${repo}. Check the repo name and that the token includes it.`;saveLocal();render();return}
    saveLocal();await restoreHistory();await syncNow();render();
  }catch(e){S.sync.error=e.message;saveLocal();render();toast(e.message)}
}
function syncCard(){
  const sy=S.sync;
  if(sy&&sy.owner)return`<div class="card"><div class="eyebrow">Coach sync · on</div>
   <p class="tiny">Every saved session goes to <b>${esc(sy.owner)}/${esc(sy.repo)}</b> (private), so Claude can read your logs when you ask. Notes and weight changes from Claude come back here automatically.</p>
   <p class="tiny muted">Last sync ${sy.lastPush?new Date(sy.lastPush).toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'}):'never'}${sy.error?` · <span class="bad-t">${esc(sy.error)}</span>`:''}</p>
   <div class="row gap"><button class="btn primary grow" data-act="syncnow">Sync now</button><button class="btn ghost" data-act="syncoff">Disconnect</button></div></div>`;
  return`<div class="card"><div class="eyebrow">Coach sync · off</div>
   <p class="tiny">Connect this to a <b>private</b> GitHub repo and every session you save syncs there, so you can just say "check my week" and Claude reads it. Claude's notes and weight changes come back to this screen.</p>
   <ol class="tiny"><li>Create a private repo called <b>training-data</b>.</li><li>GitHub → Settings → Developer settings → Fine-grained tokens → Generate. Repository access: only <b>training-data</b>. Permissions: <b>Contents: Read and write</b>. Expiry: 1 year.</li><li>Paste it below. It stays on this phone only and is never included in backups.</li></ol>
   <label class="field"><span>Token</span><input id="sy-token" type="password" autocomplete="off" placeholder="github_pat_…"></label>
   <label class="field"><span>Repo name</span><input id="sy-repo" value="training-data"></label>
   ${sy&&sy.error?`<p class="tiny bad-t">${esc(sy.error)}</p>`:''}
   <button class="btn primary full" data-act="syncconnect">Connect</button></div>`;
}

Object.assign(ACT,{
  expand:(a)=>{view.open=+a.dataset.i;view.keepScroll=true;render()},
  shortday:async()=>{if(!await ask('Drop everything after the first 4 exercises?','Short day'))return;S.draft.entries=S.draft.entries.slice(0,4);save();render();toast('Short day. It still counts.')},
  syncconnect:()=>connectSync(),
  syncnow:()=>syncNow(false),
  syncoff:async()=>{if(!await ask('Disconnect sync? Your logs on GitHub stay where they are.','Disconnect','danger'))return;S.sync=null;saveLocal();render()},
});

// pull private history (kept out of the public app file) the first time sync connects
async function restoreHistory(){
  try{
    const r=await gh(`/repos/${S.sync.owner}/${S.sync.repo}/contents/history.json?t=${Date.now()}`,{headers:{Accept:'application/vnd.github.raw+json'}});
    if(r.status!==200)return;const h=JSON.parse(await r.text());
    const have=new Set(S.sessions.map(s=>s.id));let n=0;
    for(const s of h.sessions||[])if(!have.has(s.id)){S.sessions.push(s);n++}
    if(h.settings)for(const[k,v]of Object.entries(h.settings))if(!S.settings[k])S.settings[k]=v;
    if(h.bodyweight){const d=new Set(S.bodyweight.map(b=>b.date));for(const b of h.bodyweight)if(!d.has(b.date))S.bodyweight.push(b)}
    saveLocal();if(n)toast(`Restored ${n} past sessions`);
  }catch(e){}
}

// ---------- boot ----------
load();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if(S.draft)view={tab:'session'};
render();
if(S.sync&&S.sync.token){pullCoach(true);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullCoach(true);else if(!S.draft)syncNow(true)})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake(view.tab==='session')});

</script>
